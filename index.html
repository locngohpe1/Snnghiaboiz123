<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎂 Happy Birthday Nghĩa 🎂</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
    :root {
        --bg: #1b1840;
        --bg-deep: #110f2b;
        --yellow: #ffd23f;
        --cyan: #3bceac;
        --pink: #ee4266;
        --text: #f4f4f8;
        --muted: #aaa8cc;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        background: radial-gradient(ellipse at top, #2c2766 0%, var(--bg) 45%, var(--bg-deep) 100%);
        font-family: 'Be Vietnam Pro', 'Segoe UI', system-ui, sans-serif;
        color: var(--text);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 20px;
        overflow-x: hidden;
    }

    button:focus-visible { outline: 3px solid var(--yellow); outline-offset: 3px; }

    .container {
        position: relative;
        text-align: center;
        padding: 32px 24px;
        width: 100%;
        max-width: 920px;
        background: rgba(255, 255, 255, 0.04);
        border: 2px solid rgba(255, 255, 255, 0.08);
        border-radius: 18px;
    }

    h1 {
        font-size: clamp(30px, 6vw, 56px);
        font-weight: 900;
        line-height: 1.1;
        letter-spacing: -0.02em;
        margin-bottom: 14px;
        text-shadow: 4px 4px 0 var(--pink);
    }

    .sub { color: var(--muted); font-size: 18px; margin-bottom: 28px; }

    .btn {
        font-family: inherit;
        font-weight: 800;
        border: none;
        cursor: pointer;
        border-radius: 12px;
        transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .start-btn {
        font-size: 20px;
        padding: 16px 36px;
        background: var(--yellow);
        color: var(--bg-deep);
        box-shadow: 0 6px 0 #c99b00;
    }
    .start-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 0 #c99b00; }
    .start-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #c99b00; }

    .tip { font-size: 14px; color: var(--muted); margin-top: 26px; line-height: 1.8; }

    .art-container {
        display: none;
        white-space: pre;
        font-family: 'Courier New', Consolas, monospace;
        font-size: 10px;
        line-height: 1.15;
        text-align: left;
        overflow: auto;
        padding: 14px;
        background: rgba(0, 0, 0, 0.45);
        border-radius: 12px;
        max-height: 75vh;
        color: var(--cyan);
    }
    @media (max-width: 768px) { .art-container { font-size: 5px; padding: 8px; } }

    /* Confetti rơi */
    .fx { position: fixed; inset: 0; pointer-events: none; z-index: -1; overflow: hidden; }
    .drop { position: absolute; top: -10%; font-size: 22px; animation: fall linear forwards; }
    @keyframes fall {
        to { top: 110%; transform: rotate(360deg); opacity: 0.2; }
    }

    .wish {
        margin-top: 24px;
        padding: 24px;
        border-radius: 14px;
        background: var(--yellow);
        color: var(--bg-deep);
        animation: pop 0.5s ease;
    }
    .wish h2 { font-size: clamp(24px, 4vw, 34px); font-weight: 900; margin-bottom: 8px; }
    .wish p { font-size: 17px; font-weight: 600; }
    @keyframes pop { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    /* Nút chạy trốn */
    .invite {
        position: relative;
        margin-top: 28px;
        padding: 24px;
        min-height: 270px;
        border-radius: 14px;
        border: 2px dashed rgba(255, 255, 255, 0.2);
        overflow: hidden;
    }
    .invite h3 { font-size: 22px; font-weight: 800; margin-bottom: 6px; }
    .invite p { color: var(--muted); margin-bottom: 22px; }
    .runaway-wrap { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
    .runaway-btn {
        padding: 13px 20px;
        font-size: 16px;
        background: var(--cyan);
        color: var(--bg-deep);
        box-shadow: 0 5px 0 #23927a;
        min-width: 170px;
        transition: left 0.5s ease, top 0.5s ease, background 0.2s;
    }
    .runaway-btn.tired { background: var(--yellow); box-shadow: 0 5px 0 #c99b00; }
    .runaway-btn.caught { background: var(--pink); color: var(--text); box-shadow: 0 5px 0 #a82342; }
    #gameHint { margin-top: 18px; font-size: 15px; color: var(--yellow); font-weight: 600; }

    /* Game */
    .game-container {
        text-align: center;
        width: 100%;
        max-width: 660px;
        padding: 20px;
        background: rgba(0, 0, 0, 0.35);
        border-radius: 18px;
        border: 2px solid rgba(255, 255, 255, 0.1);
    }
    .game-container h2 { font-size: 30px; font-weight: 900; text-shadow: 3px 3px 0 var(--pink); margin-bottom: 14px; }
    .game-intro { padding: 24px; font-size: 18px; line-height: 1.6; }
    .game-intro .rules { color: var(--muted); font-size: 15px; margin-top: 8px; }
    #countdown { font-size: 64px; font-weight: 900; color: var(--yellow); margin-top: 14px; transition: transform 0.2s; }
    .game-ui { display: none; font-size: 16px; font-weight: 600; margin-bottom: 10px; }
    .game-ui span { margin: 0 8px; }
    .game-canvas {
        display: none;
        width: 100%;
        max-width: 600px;
        height: auto;
        margin: 0 auto;
        border-radius: 10px;
        border: 3px solid var(--cyan);
        touch-action: none;
        cursor: none;
    }
    .game-controls { display: none; margin-top: 12px; font-size: 14px; color: var(--muted); }
    #restartBtn {
        display: none;
        margin-top: 14px;
        padding: 10px 22px;
        background: var(--pink);
        color: var(--text);
        box-shadow: 0 4px 0 #a82342;
    }

    /* Màn cuối */
    .final { display: none; max-width: 680px; text-align: left; }
    .final h1 { text-align: center; }
    .final .lead { font-size: 19px; line-height: 1.75; margin: 18px 0 26px; }
    .final .lead em { color: var(--yellow); font-style: normal; font-weight: 700; }
    .wishlist {
        background: var(--text);
        color: var(--bg-deep);
        padding: 26px 28px;
        border-radius: 14px;
        box-shadow: 8px 8px 0 var(--cyan);
    }
    .wishlist h3 { font-size: 20px; font-weight: 900; margin-bottom: 14px; }
    .wishlist ul { list-style: none; }
    .wishlist li { font-size: 17px; padding: 8px 0; border-bottom: 1px dashed #c9c7e0; }
    .wishlist li:last-child { border-bottom: none; }
    .sign { margin-top: 20px; font-size: 18px; font-weight: 800; }
    .sign small { display: block; font-weight: 400; color: #55537a; margin-top: 4px; }
    .final-actions { text-align: center; margin-top: 30px; }
    .final-actions .btn { padding: 14px 26px; font-size: 16px; margin: 6px; }
    .share-btn { background: var(--yellow); color: var(--bg-deep); box-shadow: 0 5px 0 #c99b00; }
    .save-btn { background: var(--cyan); color: var(--bg-deep); box-shadow: 0 5px 0 #23927a; }

    /* Nhạc */
    .music-controls { position: fixed; bottom: 20px; right: 20px; z-index: 1000; display: flex; flex-direction: column; gap: 10px; }
    .music-btn {
        width: 50px; height: 50px; border-radius: 50%; font-size: 20px;
        background: rgba(255, 255, 255, 0.12); color: var(--text);
        border: 2px solid rgba(255, 255, 255, 0.2);
    }
    .music-btn:hover { background: rgba(255, 255, 255, 0.22); }
    .music-info {
        position: fixed; bottom: 20px; left: 20px; z-index: 1000;
        background: rgba(0, 0, 0, 0.75); padding: 10px 16px; border-radius: 12px; font-size: 14px;
        opacity: 0; transition: opacity 0.3s ease; pointer-events: none;
    }
    .music-info.show { opacity: 1; }

    @media (prefers-reduced-motion: reduce) {
        .drop, .wish { animation: none; display: none; }
    }
</style>
</head>
<body>
<div class="fx" id="fx"></div>

<audio id="backgroundMusic" loop></audio>

<div class="music-controls">
    <button class="btn music-btn" id="musicButton" onclick="toggleMusic()" title="Bật/tắt nhạc">🎵</button>
    <button class="btn music-btn" id="volumeButton" onclick="changeVolume()" title="Đổi âm lượng">🔊</button>
</div>
<div class="music-info" id="musicInfo"></div>

<div class="container" id="mainContainer">
    <div id="startScreen">
        <h1 id="startTitle">Ê Nghĩa, có quà nè</h1>
        <p class="sub">Bấm đi, không có virus đâu 😏</p>
        <button class="btn start-btn" id="startButton">🎁 Mở quà</button>
        <p class="tip">
            📱 Xài điện thoại thì xoay ngang màn hình cho dễ coi nha.<br>
            🔊 Bật loa lên cho có không khí.
        </p>
    </div>
    <div class="art-container" id="artContainer"></div>
</div>

<script>
// =========================================================
// ✏️ CHỈNH Ở ĐÂY LÀ ĐỦ
// =========================================================
var CONFIG = {
    name: 'Nghĩa',                       // tên người được chúc
    nameAscii: 'NGHIA',                  // tên in chữ to (chỉ chữ có sẵn trong FONT bên dưới)
    from: 'Thằng bạn chí cốt',           // đổi thành tên của bạn
    music: 'nghia-birthday-song.mp3'     // file nhạc để cùng thư mục
};

// =========================================================
// 🎵 NHẠC
// =========================================================
var music = document.getElementById('backgroundMusic');
music.src = CONFIG.music;
music.volume = 0.4;
var musicPlaying = false;
var volumes = [0.4, 0.7, 0.1];
var volumeIcons = ['🔊', '🔊', '🔉'];
var volumeLabels = ['vừa', 'to', 'nhỏ'];
var volumeIndex = 0;

function showMusicInfo(msg) {
    var info = document.getElementById('musicInfo');
    info.textContent = '🎵 ' + msg;
    info.classList.add('show');
    clearTimeout(showMusicInfo.t);
    showMusicInfo.t = setTimeout(function () { info.classList.remove('show'); }, 2200);
}

function playMusic() {
    music.play().then(function () {
        musicPlaying = true;
        document.getElementById('musicButton').textContent = '🎵';
        showMusicInfo('Nhạc lên!');
    }).catch(function () {
        showMusicInfo('Trình duyệt chặn nhạc, bấm 🎵 để bật');
    });
}

function toggleMusic() {
    if (musicPlaying) {
        music.pause();
        musicPlaying = false;
        document.getElementById('musicButton').textContent = '🔇';
        showMusicInfo('Đã tắt nhạc');
    } else {
        playMusic();
    }
}

function changeVolume() {
    volumeIndex = (volumeIndex + 1) % volumes.length;
    music.volume = volumes[volumeIndex];
    document.getElementById('volumeButton').textContent = volumeIcons[volumeIndex];
    showMusicInfo('Âm lượng: ' + volumeLabels[volumeIndex]);
}

music.addEventListener('error', function () {
    console.log('Không tìm thấy file nhạc: ' + CONFIG.music);
});

// =========================================================
// 🎉 CONFETTI
// =========================================================
function startConfetti() {
    var fx = document.getElementById('fx');
    var symbols = ['🎉', '🎊', '🎈', '⭐', '🍻', '🎮', '🍕', '✨'];
    setInterval(function () {
        var d = document.createElement('div');
        d.className = 'drop';
        d.textContent = symbols[Math.floor(Math.random() * symbols.length)];
        d.style.left = Math.random() * 100 + '%';
        var dur = Math.random() * 3 + 6;
        d.style.animationDuration = dur + 's';
        fx.appendChild(d);
        setTimeout(function () { d.remove(); }, dur * 1000);
    }, 450);
}

// =========================================================
// 🖨️ ASCII ART (tự căn lề, sửa chữ thoải mái không lệch khung)
// =========================================================
var ART_WIDTH = 106;

function center(str) {
    var len = Array.from(str).length;
    var pad = Math.max(0, Math.floor((ART_WIDTH - len) / 2));
    return ' '.repeat(pad) + str;
}

function box(title, lines) {
    lines = lines.map(function (l) { return l.normalize('NFC'); });
    var all = title ? [title.normalize('NFC')].concat(lines) : lines;
    var w = Math.max.apply(null, all.map(function (l) { return Array.from(l).length; }));
    var out = [];
    out.push('╔' + '═'.repeat(w + 4) + '╗');
    if (title) {
        var t = title.normalize('NFC');
        var left = Math.floor((w - Array.from(t).length) / 2);
        out.push('║  ' + ' '.repeat(left) + t + ' '.repeat(w - left - Array.from(t).length) + '  ║');
        out.push('╟' + '─'.repeat(w + 4) + '╢');
    }
    lines.forEach(function (l) {
        out.push('║  ' + l + ' '.repeat(w - Array.from(l).length) + '  ║');
    });
    out.push('╚' + '═'.repeat(w + 4) + '╝');
    return out.map(center);
}

var FONT = {
    N: ['███╗   ██╗', '████╗  ██║', '██╔██╗ ██║', '██║╚██╗██║', '██║ ╚████║', '╚═╝  ╚═══╝'],
    G: [' ██████╗ ', '██╔════╝ ', '██║  ███╗', '██║   ██║', '╚██████╔╝', ' ╚═════╝ '],
    H: ['██╗  ██╗', '██║  ██║', '███████║', '██╔══██║', '██║  ██║', '╚═╝  ╚═╝'],
    I: ['██╗', '██║', '██║', '██║', '██║', '╚═╝'],
    A: [' █████╗ ', '██╔══██╗', '███████║', '██╔══██║', '██║  ██║', '╚═╝  ╚═╝']
};

function bigText(word) {
    var rows = ['', '', '', '', '', ''];
    word.split('').forEach(function (ch) {
        var g = FONT[ch];
        if (!g) return;
        for (var i = 0; i < 6; i++) rows[i] += g[i];
    });
    return rows.map(center);
}

var HAPPY_BIRTHDAY = [
    ' ██╗  ██╗ █████╗ ██████╗ ██████╗ ██╗   ██╗    ██████╗ ██╗██████╗ ████████╗██╗  ██╗██████╗  █████╗ ██╗   ██╗',
    ' ██║  ██║██╔══██╗██╔══██╗██╔══██╗╚██╗ ██╔╝    ██╔══██╗██║██╔══██╗╚══██╔══╝██║  ██║██╔══██╗██╔══██╗╚██╗ ██╔╝',
    ' ███████║███████║██████╔╝██████╔╝ ╚████╔╝     ██████╔╝██║██████╔╝   ██║   ███████║██║  ██║███████║ ╚████╔╝ ',
    ' ██╔══██║██╔══██║██╔═══╝ ██╔═══╝   ╚██╔╝      ██╔══██╗██║██╔══██╗   ██║   ██╔══██║██║  ██║██╔══██║  ╚██╔╝  ',
    ' ██║  ██║██║  ██║██║     ██║        ██║       ██████╔╝██║██║  ██║   ██║   ██║  ██║██████╔╝██║  ██║   ██║   ',
    ' ╚═╝  ╚═╝╚═╝  ╚═╝╚═╝     ╚═╝        ╚═╝       ╚═════╝ ╚═╝╚═╝  ╚═╝   ╚═╝   ╚═╝  ╚═╝╚═════╝ ╚═╝  ╚═╝   ╚═╝   '
];

function buildArt() {
    var L = [];
    L.push(center('🎉   🎈   🎂   🎈   🎉'), '');
    L = L.concat(HAPPY_BIRTHDAY, ['']);
    L = L.concat(bigText(CONFIG.nameAscii), ['', '']);
    L.push(center('>>>  LEVEL UP!  +1 TUỔI  <<<'), '');
    L = L.concat(box('HỒ SƠ NHÂN VẬT', [
        'Tên            : ' + CONFIG.name,
        'Level          : +1 (vừa lên cấp hôm nay)',
        'Máu            : vẫn trâu',
        'Độ đẹp trai    : tự chấm 10/10',
        'Skill đặc biệt : "5 phút nữa tới" (thực tế 30 phút)',
        'Điểm yếu       : đồ ăn ngon, deal giảm giá'
    ]));
    L.push('');
    L = L.concat(box('', [
        'Không sến, không dài dòng.',
        'Chỉ muốn nói: quen được ông là một deal hời.',
        '',
        'Cảm ơn vì lúc vui thì cùng quậy,',
        'lúc khó thì không cần hỏi cũng có mặt.'
    ]));
    L.push('', center('🍻   Nâng ly: 1... 2... 3... ZÔ!   🍻'));
    return Array.from(L.join('\n'));
}

var artChars = [];
var artIndex = 0;
var finalMessageShown = false;

function typeWriter() {
    var el = document.getElementById('artContainer');
    if (artIndex < artChars.length) {
        artIndex = Math.min(artChars.length, artIndex + 4);
        el.textContent = artChars.slice(0, artIndex).join('');
        el.scrollTop = el.scrollHeight;
        setTimeout(typeWriter, 12);
    } else if (!finalMessageShown) {
        showWish();
    }
}

function startSurprise() {
    playMusic();
    document.getElementById('startScreen').style.display = 'none';
    var art = document.getElementById('artContainer');
    art.style.display = 'block';
    art.textContent = '';
    artChars = buildArt();
    artIndex = 0;
    setTimeout(typeWriter, 600);
}

function showWish() {
    finalMessageShown = true;
    setTimeout(function () {
        var w = document.createElement('div');
        w.className = 'wish';
        w.innerHTML =
            '<h2>🎂 Sinh nhật vui vẻ nha, ' + CONFIG.name + '!</h2>' +
            '<p>Tuổi mới: nhiều tiền, ít deadline, sức khỏe max level.</p>';
        document.getElementById('mainContainer').appendChild(w);
        setTimeout(showGameInvitation, 2500);
    }, 1200);
}

// =========================================================
// 🏃 NÚT CHẠY TRỐN
// =========================================================
var runs = { play: 0, lazy: 0 };
var caught = false;

function showGameInvitation() {
    var box = document.createElement('div');
    box.className = 'invite';
    box.id = 'invite';
    box.innerHTML =
        '<h3>🎮 Còn một màn cuối</h3>' +
        '<p>Chơi xíu game không? Nhanh thôi, cuối game có lời nhắn.</p>' +
        '<div class="runaway-wrap">' +
            '<button class="btn runaway-btn" id="playBtn">😎 Chơi luôn (đố bắt)</button>' +
            '<button class="btn runaway-btn" id="lazyBtn">🥱 Lười lắm (đố bắt)</button>' +
        '</div>' +
        '<p id="gameHint">Bấm vào nút nào cũng được, nếu bắt kịp 😏</p>';
    document.getElementById('mainContainer').appendChild(box);

    ['play', 'lazy'].forEach(function (type) {
        var b = document.getElementById(type + 'Btn');
        b.addEventListener('mouseenter', function () { runAway(b, type); });
        b.addEventListener('click', function () {
            if (runs[type] < 3) { runAway(b, type); return; }
            catchButton(b);
        });
    });
    box.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function runAway(btn, type) {
    if (caught || runs[type] >= 3) return;
    runs[type]++;
    var box = document.getElementById('invite');
    var maxX = box.clientWidth - btn.offsetWidth - 10;
    var maxY = box.clientHeight - btn.offsetHeight - 50;
    btn.style.position = 'absolute';
    btn.style.left = Math.max(10, Math.random() * maxX) + 'px';
    btn.style.top = Math.max(90, Math.random() * maxY) + 'px';

    var msgs = [
        'Hụt rồi kìa 😏 (1/3)',
        'Chậm quá ông ơi 🐢 (2/3)',
        'Thôi mệt rồi, cho bắt đó 😮‍💨'
    ];
    document.getElementById('gameHint').textContent = msgs[runs[type] - 1];
    if (runs[type] >= 3) btn.classList.add('tired');
}

function catchButton(btn) {
    if (caught) return;
    caught = true;
    btn.textContent = '✅ Bắt được rồi!';
    btn.classList.add('caught');
    document.getElementById('gameHint').textContent =
        btn.id === 'lazyBtn' ? 'Lười cũng phải chơi 😤 Vào game!' : 'Ok, vào game!';
    setTimeout(startGame, 1500);
}

// =========================================================
// 🧱 GAME: PHÁ ĐẢO TUỔI MỚI
// =========================================================
var W = 600, H = 420, SPEED = 3.2;
var OBSTACLES = [
    'Deadline', 'Kẹt xe', 'Hết tiền', 'Thứ Hai', 'Mất ngủ', 'Sếp gọi',
    'Tăng ca', 'Hết pin', 'Bug', 'Hóa đơn', 'Trời mưa', 'Lười',
    'Cảm cúm', 'Trễ hẹn', 'Overthink', 'Cháy túi', 'Họp online', 'Wifi lag'
];
var ROW_COLORS = ['#ee4266', '#ffd23f', '#3bceac'];
var canvas, ctx, paddle, ball, bricks, popups, score, lives, running = false, attached = true, lost = false;
var gameStarted = false;

function startGame() {
    if (gameStarted) return;
    gameStarted = true;
    document.getElementById('mainContainer').style.display = 'none';

    var g = document.createElement('div');
    g.className = 'game-container';
    g.id = 'gameContainer';
    g.innerHTML =
        '<h2>🧱 PHÁ ĐẢO TUỔI MỚI</h2>' +
        '<div class="game-intro" id="gameIntro">' +
            '<div>Nhiệm vụ: đập hết chướng ngại để lấy cúp 🏆</div>' +
            '<div class="rules">Có 5 mạng. Thua là quê đó nha.</div>' +
            '<div id="countdown">5</div>' +
        '</div>' +
        '<div class="game-ui" id="gameUI"><span id="gameScore">Điểm: 0</span><span id="gameLives"></span></div>' +
        '<canvas id="gameCanvas" class="game-canvas" width="' + W + '" height="' + H + '"></canvas>' +
        '<div class="game-controls" id="gameControls">Rê chuột / kéo tay để di chuyển tấm đỡ · Bấm để bắn bóng</div>' +
        '<button class="btn" id="restartBtn" onclick="restartGame()">🔄 Chơi lại</button>';
    document.body.insertBefore(g, document.querySelector('.music-controls'));

    var count = 5;
    var cd = document.getElementById('countdown');
    var timer = setInterval(function () {
        count--;
        if (count > 0) {
            cd.textContent = count;
            cd.style.transform = 'scale(1.3)';
            setTimeout(function () { cd.style.transform = 'scale(1)'; }, 200);
        } else {
            clearInterval(timer);
            cd.textContent = 'GO! 🚀';
            cd.style.color = '#3bceac';
            setTimeout(function () {
                document.getElementById('gameIntro').style.display = 'none';
                document.getElementById('gameUI').style.display = 'block';
                document.getElementById('gameCanvas').style.display = 'block';
                document.getElementById('gameControls').style.display = 'block';
                document.getElementById('restartBtn').style.display = 'inline-block';
                initGame();
            }, 800);
        }
    }, 1000);
}

function initGame() {
    canvas = document.getElementById('gameCanvas');
    ctx = canvas.getContext('2d');
    canvas.addEventListener('pointermove', function (e) { movePaddle(e.clientX); });
    canvas.addEventListener('pointerdown', function (e) {
        e.preventDefault();
        if (lost) { restartGame(); return; }
        movePaddle(e.clientX);
        launchBall();
    });
    restartGame();
}

function restartGame() {
    paddle = { x: W / 2 - 55, y: H - 28, w: 110, h: 12 };
    ball = { x: W / 2, y: H - 40, dx: 0, dy: 0, r: 8 };
    score = 0;
    lives = 5;
    lost = false;
    popups = [];
    createBricks();
    resetBall();
    updateUI();
    if (!running) { running = true; requestAnimationFrame(loop); }
}

function createBricks() {
    bricks = [];
    var cols = 6, bw = 88, bh = 26, gap = 8;
    var left = (W - (cols * bw + (cols - 1) * gap)) / 2;
    var top = 100;
    OBSTACLES.forEach(function (label, i) {
        var r = Math.floor(i / cols), c = i % cols;
        bricks.push({
            x: left + c * (bw + gap), y: top + r * (bh + gap),
            w: bw, h: bh, label: label, color: ROW_COLORS[r % ROW_COLORS.length], dead: false
        });
    });
}

function movePaddle(clientX) {
    var rect = canvas.getBoundingClientRect();
    var x = (clientX - rect.left) * (W / rect.width);
    paddle.x = Math.max(0, Math.min(W - paddle.w, x - paddle.w / 2));
}

function resetBall() {
    attached = true;
    ball.dx = 0;
    ball.dy = 0;
}

function launchBall() {
    if (!attached || !running) return;
    attached = false;
    var ang = (Math.random() - 0.5) * 0.8;
    ball.dx = SPEED * Math.sin(ang);
    ball.dy = -SPEED * Math.cos(ang);
}

function updateUI() {
    document.getElementById('gameScore').textContent = 'Điểm: ' + score;
    document.getElementById('gameLives').textContent = 'Mạng: ' + '❤️'.repeat(Math.max(0, lives));
}

function loop() {
    if (!running) return;

    if (attached) {
        ball.x = paddle.x + paddle.w / 2;
        ball.y = paddle.y - ball.r - 1;
    } else {
        ball.x += ball.dx;
        ball.y += ball.dy;
    }

    // Tường
    if (ball.x < ball.r) { ball.x = ball.r; ball.dx = Math.abs(ball.dx); }
    if (ball.x > W - ball.r) { ball.x = W - ball.r; ball.dx = -Math.abs(ball.dx); }
    if (ball.y < ball.r) { ball.y = ball.r; ball.dy = Math.abs(ball.dy); }

    // Rớt đáy
    if (ball.y > H + ball.r) {
        lives--;
        updateUI();
        if (lives <= 0) { gameOver(); return; }
        resetBall();
    }

    // Tấm đỡ: góc nảy theo vị trí chạm
    if (ball.dy > 0 &&
        ball.y + ball.r >= paddle.y && ball.y - ball.r <= paddle.y + paddle.h &&
        ball.x >= paddle.x - ball.r && ball.x <= paddle.x + paddle.w + ball.r) {
        var hit = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
        var ang = Math.max(-1, Math.min(1, hit)) * Math.PI / 3;
        ball.dx = SPEED * Math.sin(ang);
        ball.dy = -SPEED * Math.cos(ang);
        ball.y = paddle.y - ball.r;
    }

    // Gạch
    for (var i = 0; i < bricks.length; i++) {
        var b = bricks[i];
        if (b.dead) continue;
        if (ball.x + ball.r > b.x && ball.x - ball.r < b.x + b.w &&
            ball.y + ball.r > b.y && ball.y - ball.r < b.y + b.h) {
            b.dead = true;
            var prevX = ball.x - ball.dx;
            if (prevX + ball.r > b.x && prevX - ball.r < b.x + b.w) ball.dy = -ball.dy;
            else ball.dx = -ball.dx;
            score += 10;
            popups.push({ x: b.x + b.w / 2, y: b.y, text: 'Bye ' + b.label, life: 50 });
            updateUI();
            if (bricks.every(function (x) { return x.dead; })) { draw(); gameWin(); return; }
            break;
        }
    }

    draw();
    requestAnimationFrame(loop);
}

function draw() {
    var grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#231f55');
    grad.addColorStop(1, '#110f2b');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // Cúp
    ctx.beginPath();
    ctx.arc(W / 2, 48, 30, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255, 210, 63, 0.18)';
    ctx.fill();
    ctx.strokeStyle = '#ffd23f';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.font = '30px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('🏆', W / 2, 50);

    // Gạch
    ctx.font = '600 12px "Be Vietnam Pro", sans-serif';
    bricks.forEach(function (b) {
        if (b.dead) return;
        ctx.fillStyle = b.color;
        ctx.fillRect(b.x, b.y, b.w, b.h);
        ctx.fillStyle = '#110f2b';
        ctx.fillText(b.label, b.x + b.w / 2, b.y + b.h / 2 + 1);
    });

    // Chữ bay lên khi phá gạch
    popups = popups.filter(function (p) { return p.life > 0; });
    popups.forEach(function (p) {
        ctx.globalAlpha = p.life / 50;
        ctx.fillStyle = '#f4f4f8';
        ctx.font = '600 13px "Be Vietnam Pro", sans-serif';
        ctx.fillText(p.text, p.x, p.y);
        ctx.globalAlpha = 1;
        p.y -= 0.8;
        p.life--;
    });

    // Tấm đỡ
    ctx.fillStyle = '#3bceac';
    ctx.fillRect(paddle.x, paddle.y, paddle.w, paddle.h);

    // Bóng
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    ctx.fillStyle = '#ffd23f';
    ctx.fill();

    if (attached) {
        ctx.fillStyle = '#aaa8cc';
        ctx.font = '600 15px "Be Vietnam Pro", sans-serif';
        ctx.fillText('Bấm để bắn bóng 🚀', W / 2, H - 60);
    }
}

function overlay(title, sub) {
    ctx.fillStyle = 'rgba(17, 15, 43, 0.85)';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffd23f';
    ctx.font = '900 36px "Be Vietnam Pro", sans-serif';
    ctx.fillText(title, W / 2, H / 2 - 22);
    ctx.fillStyle = '#f4f4f8';
    ctx.font = '600 17px "Be Vietnam Pro", sans-serif';
    ctx.fillText(sub, W / 2, H / 2 + 24);
}

function gameOver() {
    running = false;
    lost = true;
    overlay('💀 GAME OVER', 'Tuổi mới mà thua cái game? Bấm để chơi lại');
}

function gameWin() {
    running = false;
    overlay('🏆 PHÁ ĐẢO!', '18 chướng ngại, đập sạch không chừa cái nào');
    setTimeout(showFinal, 2800);
}

// =========================================================
// 💌 MÀN CUỐI
// =========================================================
function showFinal() {
    var g = document.getElementById('gameContainer');
    if (g) g.style.display = 'none';

    var f = document.createElement('div');
    f.className = 'container final';
    f.style.display = 'block';
    f.innerHTML =
        '<h1>🏆 Phá đảo tuổi mới!</h1>' +
        '<p class="lead">Deadline, kẹt xe, hết tiền, thứ Hai... đập hết rồi đó. ' +
        'Ngoài đời thì <em>gạch còn nhiều hơn và cứng hơn</em>, nhưng tui tin ông phá được hết. ' +
        'Còn lúc nào đập không nổi thì cứ gọi một tiếng, tui qua đập phụ.</p>' +
        '<div class="wishlist">' +
            '<h3>🎁 Quà thật gặp rồi đưa. Còn đây là lời chúc:</h3>' +
            '<ul>' +
                '<li>💪 Sức khỏe max level, khỏi cần hồi máu</li>' +
                '<li>💰 Ví lúc nào cũng dày, deadline lúc nào cũng mỏng</li>' +
                '<li>🚀 Làm gì cũng thuận, muốn gì cũng có</li>' +
                '<li>🍻 Anh em vẫn đủ mặt mỗi lần nâng ly</li>' +
                '<li>⏰ Và bớt "5 phút nữa tới" giùm cái 😤</li>' +
            '</ul>' +
            '<div class="sign">Sinh nhật vui vẻ nha, ' + CONFIG.name + '! 🎂' +
                '<small>— ' + CONFIG.from + '</small></div>' +
        '</div>' +
        '<div class="final-actions">' +
            '<button class="btn share-btn" onclick="shareExperience()">🔗 Gửi link này</button>' +
            '<button class="btn save-btn" onclick="downloadPage()">💾 Lưu lại</button>' +
        '</div>';
    document.body.insertBefore(f, document.querySelector('.music-controls'));
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function shareExperience() {
    var data = {
        title: '🎂 Quà sinh nhật cho ' + CONFIG.name,
        text: 'Có người làm hẳn cái web chúc sinh nhật nè 🎉',
        url: window.location.href
    };
    if (navigator.share) {
        navigator.share(data).catch(function () {});
    } else if (navigator.clipboard) {
        navigator.clipboard.writeText(window.location.href).then(function () {
            alert('🔗 Đã copy link!');
        });
    }
}

function downloadPage() {
    var blob = new Blob(['<!DOCTYPE html>\n' + document.documentElement.outerHTML], { type: 'text/html' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'sinh-nhat-' + CONFIG.nameAscii.toLowerCase() + '.html';
    a.click();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
}

// =========================================================
// KHỞI ĐỘNG
// =========================================================
window.addEventListener('load', function () {
    document.getElementById('startTitle').textContent = 'Ê ' + CONFIG.name + ', có quà nè';
    document.title = '🎂 Happy Birthday ' + CONFIG.name + ' 🎂';
    document.getElementById('startButton').addEventListener('click', startSurprise);
    if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) startConfetti();
});
</script>
